[build-system]
requires = ["setuptools>=77", "cmake>=3.15", "ninja; platform_system != 'Windows'"]
build-backend = "setuptools.build_meta"

[project]
name = "points-lsd"
version = "0.1.0"
description = "Point-seeded LSD (Line Segment Detector) bindings used by UPAL"
readme = "README.md"
license = "AGPL-3.0-or-later AND MIT AND BSD-3-Clause"
license-files = ["LICENSE", "LICENSES/AGPL-3.0-or-later.txt", "pybind11/LICENSE"]
requires-python = ">=3.10"
authors = [
    { name = "François Costa" },
    { name = "Raphael Kreft" },
    { name = "Iago Suárez" },
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: C++",
    "Topic :: Scientific/Engineering :: Image Processing",
]
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
test = ["pytest>=7", "opencv-python-headless>=4.8", "scipy>=1.10", "scikit-image>=0.21"]

[project.urls]
Repository = "https://github.com/francois141/points_lsd"
Upstream = "https://github.com/iago-suarez/pytlsd"
Paper = "https://arxiv.org/abs/2608.19894"

[tool.setuptools]
packages = []

[tool.cibuildwheel]
build = "cp310-* cp311-* cp312-* cp313-* cp314-*"
skip = "*-musllinux_*"
build-verbosity = 1
test-requires = ["numpy", "pytest"]
test-command = "pytest -q {project}/tests/test_smoke.py"
before-build = "rm -rf {package}/build"

[tool.cibuildwheel.linux]
archs = ["auto64"]

[tool.cibuildwheel.macos]
archs = ["arm64", "x86_64"]
test-skip = "*-macosx_x86_64"

[tool.cibuildwheel.windows]
archs = ["AMD64"]
before-build = "rd /s /q {package}\\build 2>nul || echo."

[tool.ruff]
extend-exclude = ["pybind11"]
line-length = 120
